name: Windows Portable
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package:windows
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Check package and generate checksum
        run: |
          unzip -t release/*.zip
          cd release
          sha256sum *.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Godoy-Paint-Car-Windows-x64-Portable
          path: |
            release/*.zip
            release/SHA256SUMS.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.zip release/SHA256SUMS.txt --title "Godoy Paint Car $GITHUB_REF_NAME" --notes-file CHANGELOG.md
