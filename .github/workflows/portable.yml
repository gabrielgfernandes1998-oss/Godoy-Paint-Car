name: Windows Portable
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag existente para compilar e publicar novamente (opcional)
        required: false
        type: string
permissions:
  contents: write
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package:windows
      - name: Set up browser and test font
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            printf 'CHROMIUM_PATH=%s\n' "$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
          if [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf ]; then
            sudo apt-get update
            sudo apt-get install -y fonts-dejavu-core
          fi
      - run: npm run test:browser
      - name: Check package and generate checksum
        run: |
          unzip -t release/*.zip
          cd release
          sha256sum *.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Godoy-Paint-Car-Windows-x64-Portable
          path: |
            release/*.zip
            release/SHA256SUMS.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/*.zip release/SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" release/*.zip release/SHA256SUMS.txt --verify-tag --title "Godoy Paint Car $RELEASE_TAG" --notes-file CHANGELOG.md
          fi
